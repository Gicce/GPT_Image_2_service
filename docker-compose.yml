services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyimage}
      POSTGRES_USER: ${POSTGRES_USER:-cyimage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyimage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyimage}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-cyimage}
      REDIS_URL: redis://redis:6379/0
      # V4.2.3 社区 Skill 投稿样例目录：显式指向持久卷，重建容器不丢样例
      SKILL_SAMPLE_DIR: /app/data/skill_samples
    volumes:
      - ./certs:/app/certs:ro
      - ./.env:/app/.env:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - skill_samples:/app/data/skill_samples
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client-updates:/var/www/client-updates:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  skill_samples:
