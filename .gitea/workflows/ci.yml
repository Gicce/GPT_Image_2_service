# CyImagePro 服务端内网 CI（Gitea Actions）
# Runner: gpt-image-service-ci（Windows 工作站 host 模式，复用本机 Python 3.12 / Node 18 / 本地 PostgreSQL+Redis）
# 隔离边界：
# - 后端测试使用专用测试库（conftest 重建 cyimage_v4_test）+ 本地 Redis db15，绝不连接生产数据库
# - 支付链路在测试中全部 monkeypatch 模拟，不发生真实收费/支付/退款
# - 不部署、不推送镜像、不触碰生产；Docker 镜像构建验证因本机无 Docker 未覆盖（如实标注）

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  guard:
    name: sensitive & config guard
    runs-on: gpt-image-service-ci
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned source
        uses: https://192.168.110.142/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 敏感文件不得被 Git 跟踪
        run: |
          bad=$(git ls-files | grep -iE '(^|/)\.env$|(^|/)\.env\.(local|prod)(\.|$)|\.pem$|\.p12$|(^|/)certs/|\.bak$|(^|/)backups/' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下敏感文件被 Git 跟踪："
            echo "$bad"
            exit 1
          fi
          echo "OK：无被跟踪的 .env / 证书 / 备份文件"

      - name: .env.example 只允许占位值
        run: |
          for f in .env.example backend/.env.example; do
            [ -f "$f" ] || continue
            # 疑似真实密钥 = 非空值（≥2 字符）且不以 change/your/replace/example/placeholder/dummy
            # 等占位前缀开头（占位值如 change-me / change-this-secret-key-in-production / your-key-here）
            bad=$(grep -E '^(WECHAT_APIV3_KEY|PACKYAPI[A-Z_]*TOKEN|SECRET_KEY)=..+' "$f" \
              | grep -viE '=(change|your|replace|example|placeholder|dummy)[-_ a-z0-9]*$' || true)
            if [ -n "$bad" ]; then
              echo "::error::$f 存在疑似真实密钥（非占位值）"
              exit 1
            fi
          done
          echo "OK：示例配置均为占位值"

      - name: 部署与编排文件静态校验
        run: |
          bash -n deploy.sh && echo "OK deploy.sh 语法"
          python - <<'EOF'
          import yaml, sys
          with open('docker-compose.yml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          assert 'services' in doc and {'backend', 'postgres', 'redis', 'nginx'} <= set(doc['services']), 'compose 服务不全'
          print('OK docker-compose.yml 结构（services:', ', '.join(sorted(doc['services'])), '）')
          EOF

  backend:
    name: backend pytest
    needs: guard
    runs-on: gpt-image-service-ci
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned source
        uses: https://192.168.110.142/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install backend dev dependencies
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements-dev.txt

      - name: Run backend tests（专用测试库 + Redis db15 + 模拟支付）
        run: python -m pytest
        working-directory: backend

  admin:
    name: admin frontend build
    needs: guard
    runs-on: gpt-image-service-ci
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned source
        uses: https://192.168.110.142/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install admin frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build admin frontend
        run: npm run build
        working-directory: frontend
